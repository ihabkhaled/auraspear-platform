name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---- Hard gates: must pass ----
  validate:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate (api)
        run: pnpm --filter @auraspear/api prisma:generate
      - name: Typecheck (web + api)
        run: pnpm typecheck
      - name: Build (web + api)
        run: pnpm build

  # ---- Advisory: runs and reports, does not block (pre-existing debt) ----
  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory: pre-existing lint/format debt (see docs/audit/02-risk-register.md).
      # Runs and annotates, but does not fail the check.
      - name: ESLint (advisory)
        continue-on-error: true
        run: pnpm lint || true
      - name: Prettier check (advisory)
        continue-on-error: true
        run: pnpm format:check || true

  test:
    name: test (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auraspear_soc
          POSTGRES_USER: auraspear
          POSTGRES_PASSWORD: auraspear
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auraspear -d auraspear_soc"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://auraspear:auraspear@localhost:5432/auraspear_soc?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auraspear/api prisma:generate
      - name: Unit tests (web + api, advisory)
        continue-on-error: true
        run: pnpm test
