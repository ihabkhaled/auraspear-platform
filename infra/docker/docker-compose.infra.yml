# =============================================================================
# INFRA-only stack — Postgres + Redis + pgAdmin, for host-based development
# (run the apps on the host with `pnpm dev` / `pnpm dev:api`).
#   docker compose -f infra/docker/docker-compose.infra.yml up -d
# (use `pnpm docker:infra`)
# =============================================================================
name: auraspear-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: auraspear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auraspear_soc}
      POSTGRES_USER: ${POSTGRES_USER:-auraspear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auraspear}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-auraspear} -d ${POSTGRES_DB:-auraspear_soc}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auraspear-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auraspear-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@auraspear.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  pgadmin_data:
