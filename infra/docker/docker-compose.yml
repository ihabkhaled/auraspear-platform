# =============================================================================
# AuraSpear Platform — BASE stack (web + api + postgres + redis)
# =============================================================================
# Build context is the repo root. Run from the repo root so Compose reads the
# root .env, e.g. via `pnpm docker:dev` / `pnpm docker:prod` which layer the
# dev/prod overlays on top of this file.
#
# Secure-by-default: Postgres and Redis are NOT published to the host here
# (internal Docker network only). The dev overlay opens them for debugging.
# =============================================================================
name: auraspear

services:
  postgres:
    image: postgres:16-alpine
    container_name: auraspear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auraspear_soc}
      POSTGRES_USER: ${POSTGRES_USER:-auraspear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [auraspear]
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-auraspear} -d ${POSTGRES_DB:-auraspear_soc}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auraspear-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redisdata:/data
    networks: [auraspear]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: auraspear/api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: auraspear-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Runtime secrets (JWT_SECRET, CONFIG_ENCRYPTION_KEY, SEED_DEFAULT_PASSWORD,
    # OIDC/AWS, ...) come from the root .env. Optional so `compose config` and
    # first-time setup work before .env exists; required for real runs.
    env_file:
      - path: ../../.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-auraspear}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-auraspear_soc}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '${API_PORT:-4000}:4000'
    networks: [auraspear]
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:4000/api/v1/health',
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  web:
    image: auraspear/web:latest
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AuraSpear SOC}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_ENABLE_MSW: ${NEXT_PUBLIC_ENABLE_MSW:-false}
    container_name: auraspear-web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # Server-side calls from the web container reach the api over the network.
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:4000/api/v1}
    ports:
      - '${WEB_PORT:-3000}:3000'
    networks: [auraspear]

volumes:
  pgdata:
  redisdata:

networks:
  auraspear:
    name: auraspear
