# =============================================================================
# DEV overlay — layer on top of docker-compose.yml
#   docker compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/docker-compose.dev.yml up -d --build
# (use `pnpm docker:dev`)
#
# Opens Postgres/Redis to the host and adds pgAdmin for local debugging.
# =============================================================================
name: auraspear

services:
  postgres:
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  redis:
    ports:
      - '${REDIS_PORT:-6379}:6379'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auraspear-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@auraspear.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres: { condition: service_healthy }
    networks: [auraspear]

  api:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  web:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development

volumes:
  pgadmin_data:
